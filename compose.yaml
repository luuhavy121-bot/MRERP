services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mrerp}
      POSTGRES_USER: ${POSTGRES_USER:-mrerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "5432:5432"
    volumes:
      - mrerp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./apps/mrerp/backend
    environment:
      MRERP_ENV: development
      MRERP_MOCK_IDENTITY: "true"
      MRERP_SECRET_KEY: ${MRERP_SECRET_KEY:?Set MRERP_SECRET_KEY in your local environment}
      MRERP_DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-mrerp}
      POSTGRES_USER: ${POSTGRES_USER:-mrerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./apps/mrerp/frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  mrerp_postgres_data:
