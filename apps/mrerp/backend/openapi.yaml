          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeBasic'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeBasic'
          description: ''
  /api/v1/people/employees/{uuid}/promote/:
    post:
      operationId: api_v1_people_employees_promote_create
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeBasic'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeBasic'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeBasic'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeBasic'
          description: ''
  /api/v1/people/employees/me/:
    get:
      operationId: api_v1_people_employees_me_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeBasic'
          description: ''
  /api/v1/people/teams/:
    get:
      operationId: api_v1_people_teams_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeamList'
          description: ''
    post:
      operationId: api_v1_people_teams_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Team'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Team'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/v1/people/teams/{uuid}/:
    get:
      operationId: api_v1_people_teams_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this team.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
    put:
      operationId: api_v1_people_teams_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this team.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Team'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Team'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
    patch:
      operationId: api_v1_people_teams_partial_update
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this team.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTeam'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTeam'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTeam'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
    delete:
      operationId: api_v1_people_teams_destroy
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this team.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/people/teams/{uuid}/leaders/:
    get:
      operationId: api_v1_people_teams_leaders_retrieve
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this team.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
    post:
      operationId: api_v1_people_teams_leaders_create
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this team.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Team'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Team'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
  /api/v1/people/teams/{uuid}/leaders/{employee_uuid}/:
    delete:
      operationId: api_v1_people_teams_leaders_destroy
      parameters:
      - in: path
        name: employee_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this team.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    DebugPersona:
      type: object
      properties:
        username:
          type: string
        label:
          type: string
      required:
      - label
      - username
    DebugSwitchRequest:
      type: object
      properties:
        username:
          type: string
      required:
      - username
    EmployeeBasic:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        employee_code:
          type: string
          maxLength: 64
        display_name:
          type: string
          maxLength: 160
        job_title:
          type: string
          maxLength: 120
        team:
          type: string
          format: uuid
          nullable: true
        team_name:
          type: string
          readOnly: true
      required:
      - employee_code
      - team_name
      - uuid
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    PaginatedEmployeeBasicList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeBasic'
    PaginatedTeamList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Team'
    PatchedEmployeeBasic:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        employee_code:
          type: string
          maxLength: 64
        display_name:
          type: string
          maxLength: 160
        job_title:
          type: string
          maxLength: 120
        team:
          type: string
          format: uuid
          nullable: true
        team_name:
          type: string
          readOnly: true
    PatchedTeam:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 24
        name:
          type: string
          maxLength: 120
        is_active:
          type: boolean
        leader_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SessionResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: string
        employee_uuid:
          type: string
          format: uuid
          nullable: true
        employee_code:
          type: string
          nullable: true
        display_name:
          type: string
        rank:
          type: string
          nullable: true
        capabilities:
          type: array
          items:
            type: string
        csrf_token:
          type: string
        mock_identity:
          type: boolean
        debug_personas:
          type: array
          items:
            $ref: '#/components/schemas/DebugPersona'
      required:
      - authenticated
    Team:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 24
        name:
          type: string
          maxLength: 120
        is_active:
          type: boolean
        leader_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - leader_count
      - name
      - updated_at
      - uuid
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
