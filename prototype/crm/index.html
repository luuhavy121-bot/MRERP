OWN-WORLD: Independent MRECRM carbon header, signal yellow selection, white ledger, fine rules, workhorse UI type.
STORY: Leader scans 60 synthetic orders, opens evidence, and checks consistent reporting before defining workflow.
FIRST VIEWPORT: MRECRM header with return-to-ERP link, persistent source notice, CRM-only left navigation, search and filters, wide ledger; selected order opens a right panel.
FORM: Approved table and side-panel brief; code-led interactive prototype, no backend.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
